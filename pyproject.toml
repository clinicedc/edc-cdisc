[project]
name = "edc-cdisc"
version = "0.1.1"
description = "CDISC compliance"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "clinicedc>=4.0.6",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "clinicedc-tests>=1.2.2",
    "psycopg>=3.2",
    "ruff>=0.15.15",
    "sphinx>=9.1.0",
]

[project.urls]
Homepage = "https://github.com/clinicedc/edc-cdisc"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
source-exclude = ["bin"]
namespace = false

[tool.uv.sources]
clinicedc = { path = "../clinicedc", editable = true }
clinicedc-constants = { path = "../clinicedc-constants", editable = true }
clinicedc-tests = { path = "../clinicedc-tests", editable = true }
clinicedc-utils = { path = "../clinicedc-utils", editable = true }

[tool.ruff]
line-length = 95
indent-width = 4
target-version = "py312"
exclude = ["migrations", ".tox", ".venv"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "PLR2004", "ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C90",
    "COM",
    "ISC",
    "DTZ",
    "E",
    "F",
    "FA",
    "FURB",
    "I",
    "INT",
    "N",
    "PERF",
    "PL",
    "PLR",
    "PTH",
    "RET",
    "RUF",
    # "S",
    "S324",
    "S106",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
]

ignore = [
    "COM812",
    "TRY003"
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 12
